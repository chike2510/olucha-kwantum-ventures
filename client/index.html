    <script>
      // Load analytics only when it is configured (avoids a broken "/%VITE_ANALYTICS_ENDPOINT%/umami" request).
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%", websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!endpoint || endpoint.charAt(0) === "%" || !websiteId || websiteId.charAt(0) === "%") return;
        var script = document.createElement("script");
        script.defer = true; script.src = endpoint + "/umami"; script.setAttribute("data-website-id", websiteId);
        document.body.appendChild(script);
      })();
    </script>
